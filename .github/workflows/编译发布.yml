name: HomeGate 规范检查与目标构建
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_manifest:
        description: 已核实目标清单路径
        type: string
        default: targets/pending.json
        required: true
      luci:
        description: 已核实 LuCI 类型，与包格式独立选择
        type: choice
        options: [lua, js]
        required: true
      package_format:
        description: 按目标 SDK 校验包格式
        type: choice
        options: [auto, ipk, apk]
        required: true
      mode:
        description: 草稿仅允许源码检查；目标与核心核实后才能构建
        type: choice
        options: [仅检查源码, 仅构建, 测试预发布, 正式发布]
        default: 仅检查源码
        required: true
permissions:
  contents: read
jobs:
  source:
    name: 源码规范与回归检查
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 核实版本、路径和发布门禁
        run: |
          python3 scripts/project.py --check
          python3 scripts/重构回归.py
          python3 scripts/CI依赖归档回归.py
      - name: 验证宿主专项分组与失败阻断
        run: python3 scripts/ci-native-groups-regressions.py
      - name: 检查 Shell 语法
        run: |
          find scripts project/core/files project/core/prototype -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
          sh -n project/core/files/etc/init.d/homegate
          sh -n project/core/files/etc/hotplug.d/iface/95-homegate
          sh -n project/core/files/usr/sbin/homegate-purge
      - name: 生成前端并核实没有过期副本
        run: |
          python3 scripts/sync-frontend.py
          python3 scripts/build-js-views.py
          git diff --exit-code -- project/core/src/internal/frontend project/luci/js/htdocs
          python3 scripts/frontend-source-regressions.py
      - name: 安装 BusyBox、语法解析与页面回归依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential lua5.1 liblua5.1-0-dev libjson-c-dev libssl-dev cmake pkg-config libcrypt-dev bubblewrap zstd
          mkdir -p build/busybox-runtime
          python3 scripts/准备BusyBox归档.py
          printf '%s  %s\n' 6843ba7977081e735fa0fdb05893e3c002c8c5ad7c9c80da206e603cc0ac47e7 \
            build/busybox-runtime/busybox-1.33.2.tar.bz2 | sha256sum -c -
          tar -xjf build/busybox-runtime/busybox-1.33.2.tar.bz2 -C build/busybox-runtime
          make -C build/busybox-runtime/busybox-1.33.2 allnoconfig
          python3 - <<'PY'
          from pathlib import Path
          import re
          file = Path('build/busybox-runtime/busybox-1.33.2/.config')
          body = file.read_text()
          required = ['BUSYBOX', 'ASH', 'ASH_OPTIMIZE_FOR_SIZE', 'ASH_PRINTF', 'ASH_TEST',
                      'FEATURE_SH_MATH', 'EXPR', 'STAT', 'FEATURE_STAT_FORMAT', 'FLOCK',
                      'TR', 'MKDIR', 'MV', 'RM', 'ID', 'DIRNAME', 'CAT', 'CP',
                      'RMDIR', 'SHA256SUM', 'HEAD', 'FEATURE_FANCY_HEAD', 'FSYNC',
                      'SETSID', 'SLEEP', 'FEATURE_FANCY_SLEEP', 'FLOAT_DURATION', 'MKFIFO', 'LS', 'KILL']
          for name in required:
              pattern = r'^# CONFIG_' + name + r' is not set$'
              body, count = re.subn(pattern, 'CONFIG_' + name + '=y', body, flags=re.M)
              if count == 0:
                  assert re.search(r'^CONFIG_' + name + r'=y$', body, re.M), 'Unknown or unavailable BusyBox option: ' + name
          file.write_text(body)
          PY
          make -C build/busybox-runtime/busybox-1.33.2 oldconfig < /dev/null
          make -C build/busybox-runtime/busybox-1.33.2 -j2
          build/busybox-runtime/busybox-1.33.2/busybox --list
          build/busybox-runtime/busybox-1.33.2/busybox sleep 0.001
          echo "$PWD/build/busybox-runtime/busybox-1.33.2" >> "$GITHUB_PATH"
          python3 -m venv build/verify-venv
          build/verify-venv/bin/python -m pip install 'lupa==2.8' 'playwright==1.63.0' 'tree-sitter==0.25.2' 'tree-sitter-bash==0.25.1'
          build/verify-venv/bin/python -m playwright install --with-deps chromium
          python3 scripts/准备UCI解析回归.py
          python3 scripts/准备服务采样回归.py
          python3 scripts/准备curl回归.py
      - name: 核实扩展分组覆盖与失败阻断
        run: build/verify-venv/bin/python scripts/ci-extended-groups-regressions.py
      - name: 核实私有隔离并补齐官方bwrap配置
        run: python3 scripts/prepare-ci-isolation.py
      - name: 验证宿主ucode与DDNS候选关闭门禁
        run: sh scripts/check-ucode.sh
      - name: 验证隔离rpcd参数与DDNS会话ACL
        run: sh scripts/check-rpcd.sh
      - name: 验证真实HTTP会话授权与拒绝路径
        run: sh scripts/check-http.sh
      - name: 验证Lua会话CSRF及Lua与RPC的Shell只读链路
        run: sh scripts/check-luci.sh
      - name: 验证固定来源持久旧配置迁移
        run: |
          build/verify-venv/bin/python scripts/持久旧配置迁移回归.py
          build/verify-venv/bin/python scripts/持久旧配置迁移回归.py --runtime
      - name: 验证工程DDNS固定部署范围与语法
        run: build/verify-venv/bin/python scripts/工程DDNS部署回归.py
      - name: 验证生命周期运行锁与持久准备
        run: |
          build/verify-venv/bin/python scripts/生命周期准备回归.py
          build/verify-venv/bin/python scripts/生命周期准备回归.py --runtime
      - name: 验证迁移后同代 Cloudflare 只读业务
        run: |
          build/verify-venv/bin/python scripts/生命周期业务集成回归.py
          build/verify-venv/bin/python scripts/生命周期业务集成回归.py --runtime
      - name: 验证 DNS 检查点准备残留的受控发布
        run: |
          build/verify-venv/bin/python scripts/DNS检查点修复回归.py
          build/verify-venv/bin/python scripts/DNS检查点修复回归.py --runtime
      - name: 验证已确认 DNS 原孤立目录的收集
        run: |
          build/verify-venv/bin/python scripts/DNS孤立收集回归.py
          build/verify-venv/bin/python scripts/DNS孤立收集回归.py --runtime
      - name: 验证 DNS 中断终态发布的明确恢复
        run: |
          build/verify-venv/bin/python scripts/DNS终态修复回归.py
          build/verify-venv/bin/python scripts/DNS终态修复回归.py --runtime
      - name: 验证 DNS 归档容量回收与中断续做
        run: |
          build/verify-venv/bin/python scripts/DNS归档保留回归.py
          build/verify-venv/bin/python scripts/DNS归档保留回归.py --runtime
      - name: 验证 DNS 终态回执收集与跨启动只读恢复
        run: |
          build/verify-venv/bin/python scripts/DNS回执恢复回归.py
          build/verify-venv/bin/python scripts/DNS回执恢复回归.py --runtime
      - name: 验证 DNS 变更前持久回执与写入屏障
        run: |
          build/verify-venv/bin/python scripts/DNS持久回执回归.py
          build/verify-venv/bin/python scripts/DNS持久回执回归.py --runtime
      - name: 验证 Cloudflare 未知操作的确认只读核对
        run: |
          build/verify-venv/bin/python scripts/Cloudflare核对回归.py
          build/verify-venv/bin/python scripts/Cloudflare核对回归.py --runtime
      - name: 验证 Cloudflare 配置绑定记录写入与未知结果
        run: |
          build/verify-venv/bin/python scripts/Cloudflare记录回归.py
          build/verify-venv/bin/python scripts/Cloudflare记录回归.py --runtime
      - name: 验证 Cloudflare 完整区域分页与失败隔离
        run: |
          build/verify-venv/bin/python scripts/Cloudflare区域回归.py
          build/verify-venv/bin/python scripts/Cloudflare区域回归.py --runtime
      - name: 验证 Cloudflare 私有凭据与受限 HTTPS 请求
        run: |
          build/verify-venv/bin/python scripts/Cloudflare只读回归.py
          build/verify-venv/bin/python scripts/Cloudflare只读回归.py --runtime
      - name: 验证固定服务预检启停与观察恢复
        run: |
          build/verify-venv/bin/python scripts/固定服务动作回归.py
          build/verify-venv/bin/python scripts/固定服务动作回归.py --runtime
      - name: 验证持久独立监督与孤立凭据恢复
        run: |
          build/verify-venv/bin/python scripts/持久监督恢复回归.py
          build/verify-venv/bin/python scripts/持久监督恢复回归.py --runtime
      - name: 验证持久初始化与显式恢复
        run: |
          build/verify-venv/bin/python scripts/持久初始化回归.py
          build/verify-venv/bin/python scripts/持久初始化回归.py --runtime
      - name: 验证持久事务屏障与异常退出
        run: |
          build/verify-venv/bin/python scripts/持久事务屏障回归.py
          build/verify-venv/bin/python scripts/持久事务屏障回归.py --runtime
      - name: 验证原生写入协调和对照桥接
        run: |
          build/verify-venv/bin/python scripts/原生写入协调回归.py
          build/verify-venv/bin/python scripts/原生写入协调回归.py --runtime
          (cd project/core/src && go test ./internal/frontend)
      - name: 定位固定服务四状态采样
        run: build/verify-venv/bin/python scripts/服务采样回归.py --runtime --case test_four_independent_states_sample_real_processes_and_bind_journal
      - name: 验证源配置发布与恢复
        run: |
          build/verify-venv/bin/python scripts/源配置发布回归.py --static
          build/verify-venv/bin/python scripts/源配置发布回归.py --runtime
      - name: 验证 Shell 原型语法与真实 BusyBox 执行
        run: |
          for file in project/core/prototype/*.sh; do busybox ash -n "$file"; done
          build/verify-venv/bin/python scripts/Shell原型回归.py --static
          build/verify-venv/bin/python scripts/Shell原型回归.py --runtime
          build/verify-venv/bin/python scripts/配置事务原型回归.py --static
          build/verify-venv/bin/python scripts/配置事务原型回归.py --runtime
          build/verify-venv/bin/python scripts/完整配置事务回归.py
          build/verify-venv/bin/python scripts/完整配置事务回归.py --runtime
          build/verify-venv/bin/python scripts/旧配置迁移回归.py
          build/verify-venv/bin/python scripts/旧配置迁移回归.py --runtime
          build/verify-venv/bin/python scripts/私有配置读取回归.py
          build/verify-venv/bin/python scripts/私有配置读取回归.py --runtime
          build/verify-venv/bin/python scripts/配置应用恢复回归.py --runtime
          build/verify-venv/bin/python scripts/工作监督回归.py --static
          build/verify-venv/bin/python scripts/工作监督回归.py --runtime
          build/verify-venv/bin/python scripts/服务意图回归.py --runtime
          build/verify-venv/bin/python scripts/服务采样回归.py --static
          build/verify-venv/bin/python scripts/服务采样回归.py --runtime
      - name: 验证安全导出、导航与页面行为
        run: |
          build/verify-venv/bin/python scripts/导航安全回归.py
          build/verify-venv/bin/python scripts/配置预览回归.py
          build/verify-venv/bin/python scripts/native-ui-regressions.py
          build/verify-venv/bin/python scripts/配置预览页面回归.py
          build/verify-venv/bin/python scripts/DDNS原生传输回归.py
          build/verify-venv/bin/python scripts/DDNS授权页面回归.py
          build/verify-venv/bin/python scripts/legacy-footer-regressions.py
          build/verify-venv/bin/python scripts/luci-loader-regressions.py
      - name: 按公开清单生成源码包
        run: python3 scripts/生成接续包.py --target pending --stage CI源码检查 --public-source --check-public-tree
      - name: 上传必要公开源码
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HomeGate-公开源码-${{ github.run_id }}
          path: dist/*_公开源码.zip
          if-no-files-found: error
  extended:
    name: 本批集中回归 · ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [Aliyun, DNSPod, Huawei, DDNS执行, DDNS授权状态, DDNS状态退避, DDNS授权收尾, DDNS全批, DDNS混合全批, DDNS批次收尾, DDNS有界调度, DDNS混合调度, DDNS生命周期CLI, 核心DNS只读CLI, 核心网络配置CLI, 核心健康恢复CLI, DDNS恢复摘要CLI, DDNS原生授权UI, DDNS异步任务, DDNS明确维护]
    steps:
      - name: 检出相同源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 准备固定版本的隔离回归依赖
        run: sh scripts/准备扩展CI环境.sh
      - name: 串行执行本组必要专项
        run: build/verify-venv/bin/python scripts/扩展集中回归.py '${{ matrix.group }}'
  native:
    name: 宿主接合回归 · ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [authority, tasks, receipts-cloudflare, receipts-aliyun, receipts-dnspod, receipts-huawei]
    steps:
      - name: 检出相同源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 准备固定版本的隔离回归依赖
        run: sh scripts/准备扩展CI环境.sh
      - name: 准备宿主运行时构建依赖
        run: sudo apt-get install --no-install-recommends -y cmake pkg-config libcrypt-dev bubblewrap zstd
      - name: 核实宿主私有隔离前置
        run: python3 scripts/prepare-ci-isolation.py
      - name: 串行验证本组Lua及RPC接合
        run: sh scripts/check-ddns-authority.sh --group '${{ matrix.group }}'
  build:
    name: 已核实 SDK 三包构建
    needs: [source, extended, native]
    if: github.event_name == 'workflow_dispatch' && inputs.mode != '仅检查源码'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 校验设备、核心迁移与包格式
        env:
          TARGET_MANIFEST: ${{ inputs.target_manifest }}
          LUCI: ${{ inputs.luci }}
          PACKAGE_FORMAT: ${{ inputs.package_format }}
        run: python3 scripts/检查发布条件.py --target "$TARGET_MANIFEST" --luci "$LUCI" --format "$PACKAGE_FORMAT"
      - name: 使用目标 SDK 构建并验证真实三包
        env:
          TARGET_MANIFEST: ${{ inputs.target_manifest }}
          LUCI: ${{ inputs.luci }}
          PACKAGE_FORMAT: ${{ inputs.package_format }}
        run: python3 scripts/目标SDK构建.py --target "$TARGET_MANIFEST" --luci "$LUCI" --format "$PACKAGE_FORMAT"
      - name: 上传当前目标三包及来源信息
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HomeGate-目标三包-${{ github.run_id }}
          path: dist/target/
          if-no-files-found: error
  release:
    name: 受保护的发布审批
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == '测试预发布' || inputs.mode == '正式发布')
    runs-on: ubuntu-24.04
    environment: 发布审批
    permissions:
      contents: read
    steps:
      - name: 核心迁移完成前禁止自动发布
        run: |
          echo '发布适配和实机验收尚未完成，当前阶段不执行 GitHub Release。' >&2
          exit 1
