name: HomeGate 规范检查与目标构建
on:
  workflow_dispatch:
    inputs:
      target_manifest:
        description: 构建目标清单路径
        type: string
        default: targets/qwrt-r26.3.8-ipq807x.json
        required: true
      luci:
        description: 已核实 LuCI 类型，与包格式独立选择
        type: choice
        options: [lua, js]
        default: lua
        required: true
      package_format:
        description: 按目标 SDK 校验包格式
        type: choice
        options: [auto, ipk, apk]
        default: ipk
        required: true
      mode:
        description: 仅构建会先核对源码，再编译三包
        type: choice
        options: [仅检查源码, 仅构建, 测试预发布, 正式发布]
        default: 仅构建
        required: true
permissions:
  contents: read
jobs:
  source:
    name: 构建源码核对
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 校验版本并生成原生构建输入
        run: |
          make check
          make frontend
          git diff --exit-code -- project/luci/js/htdocs
          python3 scripts/生成接续包.py --target pending --stage 源码检查 --public-source --check-public-tree
      - name: 上传经核对的源码
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HomeGate-公开源码-${{ github.run_id }}
          path: dist/*_公开源码.zip
          if-no-files-found: error
  build:
    name: SDK 三包构建
    needs: source
    if: github.event_name == 'workflow_dispatch' && inputs.mode != '仅检查源码'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 校验设备、核心迁移与包格式
        if: inputs.mode != '仅构建' || inputs.target_manifest != 'targets/qwrt-r26.3.8-ipq807x.json'
        env:
          TARGET_MANIFEST: ${{ inputs.target_manifest }}
          LUCI: ${{ inputs.luci }}
          PACKAGE_FORMAT: ${{ inputs.package_format }}
        run: python3 scripts/检查发布条件.py --target "$TARGET_MANIFEST" --luci "$LUCI" --format "$PACKAGE_FORMAT"
      - name: 安装 SDK 构建依赖
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zstd gawk libncurses-dev rsync xxd python3-setuptools
      - name: 使用目标 SDK 构建并验证真实三包
        env:
          TARGET_MANIFEST: ${{ inputs.target_manifest }}
          LUCI: ${{ inputs.luci }}
          PACKAGE_FORMAT: ${{ inputs.package_format }}
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          args=(--target "$TARGET_MANIFEST" --luci "$LUCI" --format "$PACKAGE_FORMAT")
          if [ "$BUILD_MODE" = '仅构建' ] && [ "$TARGET_MANIFEST" = 'targets/qwrt-r26.3.8-ipq807x.json' ]; then
            args+=(--candidate)
          fi
          python3 scripts/目标SDK构建.py "${args[@]}"
      - name: 上传当前目标三包及来源信息
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HomeGate-目标三包-${{ github.run_id }}
          path: dist/target/
          if-no-files-found: error
  release:
    name: 受保护的发布审批
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == '测试预发布' || inputs.mode == '正式发布')
    runs-on: ubuntu-24.04
    environment: 发布审批
    permissions:
      contents: read
    steps:
      - name: 核心迁移完成前禁止自动发布
        run: |
          echo '发布适配和实机验收尚未完成，当前阶段不执行 GitHub Release。' >&2
          exit 1
